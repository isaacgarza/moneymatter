name: Homelab images

# Fork-only workflow. Releases the fork: a push to `main` that changes the app is tagged
# `v<upstream>-hl.<N>` (see .github/scripts/homelab-next-tag.sh), and the be and fe images are
# built from that tag and pushed to GHCR. A `v*-hl.*` tag pushed by hand builds the same way.
# Upstream's own image workflow is Docker Hub/Sentry/Dokploy-specific and stays untouched
# (disabled in this fork) so upstream merges never conflict with it.
#
# Tagging and building share this workflow because a tag pushed with GITHUB_TOKEN does not
# start other workflows.
on:
  push:
    branches: [main]
    # Docs, workflow and agent-guidance changes do not change the images.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
    tags: ['v*-hl.*']

permissions:
  contents: read
  packages: write

# One release at a time, queued rather than cancelled. A newer queued run replaces an older
# one, which is safe: a run tags the commit it was started for, and that includes the older one.
concurrency:
  group: homelab-images-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A merged sync PR brings upstream's release commit but not its tag, and the base of the
      # new tag is read from the tags merged into HEAD. These stay local; only our tag is pushed.
      # Forced, so a tag upstream moved cannot stop every release.
      - name: Fetch upstream release tags
        run: |
          git remote add upstream https://github.com/letehaha/moneymatter.git
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/v*'

      # Assigned on its own line: a failure inside an echo's argument would not fail the step,
      # and a push with no release would end green.
      - name: Work out the tag
        id: next
        run: |
          tag="$(.github/scripts/homelab-next-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # When HEAD already has its tag (a re-run), the script names it and nothing is pushed, so
      # the build below still runs and its never-overwrite check makes the rebuild safe.
      - name: Push the tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} already exists, not pushing it again"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

  build:
    needs: tag
    # `tag` is skipped for a pushed tag; otherwise it names the tag to build and fails the run
    # when it cannot, which keeps a push with no release from ending green.
    if: >-
      ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      && (needs.tag.outputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: be
            file: ./self-hosting/backend/Dockerfile
            context: .
          - name: fe
            file: ./self-hosting/frontend/Dockerfile
            context: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A published tag is immutable: re-running a failed job must not move it.
      - name: Refuse to overwrite an existing tag
        env:
          REF: ghcr.io/${{ github.repository_owner }}/budget-tracker-${{ matrix.name }}:${{ env.TAG }}
        run: |
          if err=$(docker buildx imagetools inspect "$REF" 2>&1 >/dev/null); then
            echo "::notice::$REF already exists, skipping"
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif [[ "$err" == *"not found"* ]]; then
            echo "SKIP=false" >> "$GITHUB_ENV"
          else
            echo "::error::Could not check $REF: $err"
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: env.SKIP != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/budget-tracker-${{ matrix.name }}:${{ env.TAG }}
          build-args: |
            VITE_APP_COMMIT_HASH=${{ github.sha }}
