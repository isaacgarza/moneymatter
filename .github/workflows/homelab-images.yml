name: Homelab images

# Fork-only workflow. Builds the be and fe images from a `v<upstream>-hl.<N>` tag and
# pushes them to GHCR. Upstream's own image workflow is Docker Hub/Sentry/Dokploy-specific
# and stays untouched (disabled in this fork) so upstream merges never conflict with it.
on:
  push:
    tags: ['v*-hl.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: be
            file: ./self-hosting/backend/Dockerfile
            context: .
          - name: fe
            file: ./self-hosting/frontend/Dockerfile
            context: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A published tag is immutable: re-running a failed job must not move it.
      - name: Refuse to overwrite an existing tag
        env:
          REF: ghcr.io/${{ github.repository_owner }}/budget-tracker-${{ matrix.name }}:${{ github.ref_name }}
        run: |
          if err=$(docker buildx imagetools inspect "$REF" 2>&1 >/dev/null); then
            echo "::notice::$REF already exists, skipping"
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif [[ "$err" == *"not found"* ]]; then
            echo "SKIP=false" >> "$GITHUB_ENV"
          else
            echo "::error::Could not check $REF: $err"
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: env.SKIP != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/budget-tracker-${{ matrix.name }}:${{ github.ref_name }}
          build-args: |
            VITE_APP_COMMIT_HASH=${{ github.sha }}
